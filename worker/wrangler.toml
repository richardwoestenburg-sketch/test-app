# Cloudflare Worker config for the Daglog backend.
name = "daglog-api"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# KV namespace that stores the entries.
# No id here on purpose: the "Deploy to Cloudflare" wizard (and modern
# `wrangler deploy`) will provision a new namespace and bind it to DAGLOG_KV
# automatically. If you prefer to use an existing namespace, add its id:
#   { binding = "DAGLOG_KV", id = "<your-namespace-id>" }
kv_namespaces = [
  { binding = "DAGLOG_KV" }
]

# The shared secret DAGLOG_TOKEN is set separately (never committed):
#   - Deploy button / dashboard: add it under the Worker's
#     Settings -> Variables and Secrets (type: Secret).
#   - wrangler: npx wrangler secret put DAGLOG_TOKEN
